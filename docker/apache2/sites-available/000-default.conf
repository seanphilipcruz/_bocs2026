<VirtualHost *:80>
    ServerName bocs2026.local
    DocumentRoot /var/www/html/bocs2026/public

    <Directory /var/www/html/bocs2026/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
